name: PR to Dev Pipeline

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Lint backend
        run: cd backend && npm install && npm run lint

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Audit backend
        run: cd backend && npm install && npm audit --audit-level=none
      - name: Audit frontend
        run: cd frontend && npm install && npm audit --audit-level=none

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install backend dependencies
        run: cd backend && npm install
      - name: Snyk backend
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical --file=backend/package.json
      - name: Install frontend dependencies
        run: cd frontend && npm install
      - name: Snyk frontend
        continue-on-error: true
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical --file=frontend/package.json
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Test backend
        run: cd backend && npm install && npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, audit, security, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ilyesse782/backend:latest ./backend
      - name: Build frontend image
        run: docker build -t ilyesse782/frontend:latest ./frontend

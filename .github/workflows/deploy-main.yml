name: Deploy to Main

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create backend .env
        run: echo "${{ secrets.BACKEND_ENV }}" > ./backend/.env

      - name: Create frontend .env
        run: echo "${{ secrets.FRONTEND_ENV }}" > ./frontend/.env

      - name: Build and push backend
        run: |
          docker build -t ilyesse782/backend:latest ./backend
          docker push ilyesse782/backend:latest

      - name: Build and push frontend
        run: |
          docker build -t ilyesse782/frontend:latest ./frontend
          docker push ilyesse782/frontend:latest
